<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>absensi 7D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial Black;min-height:100vh;display:flex;justify-content:center;padding:16px}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,#7c3aed,#000);z-index:0}
#blur{position:fixed;inset:0;backdrop-filter:blur(30px);background:rgba(0,0,0,0.6);z-index:1}
#wrap{position:relative;z-index:10;width:100%;max-width:420px}
#card{background:#fff;color:#000;border-radius:26px;overflow:hidden;border:4px solid #000;box-shadow:0 0 60px rgba(124,58,237,0.6)}
#top{background:#e10600;padding:20px;text-align:center}
#top h1{color:#fff;font-size:42px;letter-spacing:4px;text-shadow:3px 3px 0 #000;line-height:0.9}
#top p{color:#fff;font-size:11px;letter-spacing:3px;margin-top:4px}
#mid{padding:22px;text-align:center;border-top:4px solid #000;border-bottom:4px solid #000}
#graffiti{font-family:Impact;font-size:48px;color:#2e1065;transform:rotate(-3deg) skew(-5deg);text-shadow:4px 4px 0 #fff,8px 8px 0 #1e1b4b;line-height:0.9}
#content{padding:16px;background:#f5f5f5}
.sosBtn{width:100%;display:flex;align-items:center;gap:12px;padding:16px;border:3.5px solid #000;border-radius:18px;margin-bottom:12px;font-weight:900;text-decoration:none;color:#000;background:#fff;box-shadow:0 5px 0 #000;transition:0.1s;cursor:pointer}
.sosBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.sosBtn .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #000;flex-shrink:0}
.ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff}
.tiktok{background:#000;color:#fff} .wa{background:#25D366;color:#fff} .absen{background:#e10600;color:#fff} .yt{background:#ff0000;color:#fff}
.label{font-family:Arial;font-size:10px;letter-spacing:1.5px;margin-bottom:8px}
#playBtn{position:fixed;bottom:16px;right:16px;z-index:20;background:#fff;color:#000;border:3px solid #000;border-radius:999px;padding:10px 14px;font-weight:900;font-size:11px;cursor:pointer;box-shadow:0 4px 0 #000}
#playBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
</style>
</head>
<body>
<div id="bg"></div><div id="blur"></div>

<!-- TOMBOL PLAY KECIL AJA, GA ADA TEKS AUTOPLAY -->
<button id="playBtn" onclick="toggleMusic()">🔇</button>

<!-- LAGU LU - VOLUME 30% - NO TEKS -->
<audio id="audio" loop preload="auto">
<source src="https://files.catbox.moe/frs1d6.mp3" type="audio/mpeg">
</audio>

<!-- KLIK HALUS -->
<audio id="clickSound" preload="auto">
<source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_2d9a7d4f56.mp3?filename=mouse-click-104737.mp3" type="audio/mpeg">
</audio>

<div id="wrap">
<div id="card">
<div id="top"><h1>HELLO</h1><p>PANEL SOSMED 7D</p></div>
<div id="mid"><div id="graffiti">sevennde<br>smpkuba</div></div>

<div id="content">
<div class="label">LINK RESMI KELAS 7D 👇</div>

<a class="sosBtn" href="https://instagram.com/" target="_blank" onclick="playClick()">
<div class="icon ig">📸</div>
<div><div>Instagram 7D</div><div style="font-family:Arial;font-size:10px;color:#666">Coming soon</div></div>
</a>

<a class="sosBtn" href="https://tiktok.com/" target="_blank" onclick="playClick()">
<div class="icon tiktok">🎵</div>
<div><div>TikTok 7D</div><div style="font-family:Arial;font-size:10px;color:#666">@sevendee_kuba</div></div>
</a>

<a class="sosBtn" href="https://chat.whatsapp.com/" target="_blank" onclick="playClick()">
<div class="icon wa">💬</div>
<div><div>Grup WA 7D</div><div style="font-family:Arial;font-size:10px;color:#666">https://chat.whatsapp.com/CAckr81mrKSHL6nh7YpV79</div></div>
</a>

<a class="sosBtn" href="https://absensi-kelas-7.github.io/absensi/" target="_blank" onclick="playClick()">
<div class="icon absen">📋</div>
<div><div>Absensi 7D</div><div style="font-family:Arial;font-size:10px;color:#666">Sakit / Izin</div></div>
</a>

<a class="sosBtn" href="#" onclick="playClick();">
<div class="icon yt">▶️</div>
<div><div>YouTube 7D</div><div style="font-family:Arial;font-size:10px;color:#666">Coming soon</div></div>
</a>

</div>
</div>
</div>

<script>
const audio=document.getElementById('audio');
const clickSound=document.getElementById('clickSound');
const playBtn=document.getElementById('playBtn');
audio.volume=0.3; // 30%
clickSound.volume=0.4; // klik halus kecil
let isPlaying=false;

function playClick(){
  clickSound.currentTime=0;
  clickSound.play().catch(()=>{});
}

// AUTOPLAY TANPA TEKS - LANGSUNG PLAY PAS KLIK LAYAR
function tryPlay(){
  audio.volume=0.3;
  audio.play().then(()=>{isPlaying=true; playBtn.textContent='🔊';}).catch(()=>{});
}
document.body.addEventListener('click', tryPlay, {once:true});

function toggleMusic(){
  playClick();
  if(isPlaying){
    audio.pause(); isPlaying=false; playBtn.textContent='🔇';
  }else{
    audio.volume=0.3; audio.play(); isPlaying=true; playBtn.textContent='🔊';
  }
}
</script>
</body>
</html>

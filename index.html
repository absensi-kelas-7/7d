<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7D SMPKUBA - FINAL + TIKTOK SONG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial Black}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,#4c1d95,#000);z-index:0}
#blur{position:fixed;inset:0;backdrop-filter:blur(35px);background:rgba(0,0,0,0.7);z-index:1}
#wrap{position:relative;z-index:10;width:100%;height:100%;display:flex;justify-content:center;align-items:center;padding:12px}
#card{width:100%;max-width:430px;background:#fff;border-radius:26px;overflow:hidden;border:4px solid #000;box-shadow:0 0 70px rgba(124,58,237,0.6);max-height:96vh;display:flex;flex-direction:column}
#top{background:#e10600;padding:16px;text-align:center}
#top h1{color:#fff;font-size:48px;letter-spacing:5px;text-shadow:3px 3px 0 #000}
#top p{color:#fff;letter-spacing:4px;font-size:11px}
#mid{padding:24px;text-align:center;background:#fff;border-top:4px solid #000;border-bottom:4px solid #000}
#graffiti{font-family:Impact;font-size:52px;color:#2e1065;transform:rotate(-4deg) skew(-6deg);text-shadow:4px 4px 0 #fff,9px 9px 0 #1e1b4b;line-height:0.9}
#musicBar{background:#111;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #000}
#musicInfo{font-family:Arial;font-size:10px;font-weight:900}
#playBtn{background:#fff;color:#000;border:2px solid #000;border-radius:999px;padding:7px 12px;font-weight:900;cursor:pointer;font-size:10px}
#playBtn.playing{background:#a78bfa;box-shadow:0 0 15px #a78bfa}
#content{padding:14px;background:#f4f4f5;overflow-y:auto;flex:1}
#nama{width:100%;padding:12px;border:3px solid #000;border-radius:12px;font-weight:900;margin-bottom:10px;font-family:Arial}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.btnAbsen{padding:20px;border:3.5px solid #000;border-radius:18px;font-weight:900;font-size:17px;color:#fff;cursor:pointer;box-shadow:0 5px 0 #000;transition:0.1s}
.btnAbsen:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
#btnSakit{background:#f59e0b} #btnIzin{background:#6366f1}
#listWrap{background:#fff;border:3px solid #000;border-radius:14px;padding:10px;min-height:70px;max-height:22vh;overflow-y:auto;margin-bottom:10px}
#kirim{width:100%;padding:13px;background:#000;color:#fff;border-radius:999px;font-weight:900;cursor:pointer}
#animOverlay{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center}
#animOverlay.show{display:flex}
#animText{font-family:Impact;white-space:nowrap;font-size:clamp(28px,8vw,64px);color:#fff;text-shadow:0 0 20px #a78bfa,6px 6px 0 #000;animation:zoom 3.8s forwards}
@keyframes zoom{0%{transform:scale(0.05);opacity:0;filter:blur(20px)}28%{transform:scale(1.2);opacity:1;filter:blur(0)}38%{transform:scale(1)}68%{transform:scale(1)}100%{transform:scale(35);opacity:0;filter:blur(40px)}}
</style>
</head>
<body>
<div id="bg"></div><div id="blur"></div>
<div id="wrap">
<div id="card">
<div id="top"><h1>HELLO</h1><p>MY NAME IS</p></div>
<div id="mid"><div id="graffiti">sevennde<br>smpkuba</div></div>

<div id="musicBar">
<div>
<div id="musicInfo">🎵 TIKTOK - VOL 30%</div>
<div style="font-family:Arial;font-size:8px;color:#9ca3af">frs1d6.mp3 • loop</div>
</div>
<button id="playBtn" onclick="toggleMusic()">▶️ PLAY</button>

<!-- LAGU TIKTOK LU - VOLUME 30% -->
<audio id="audio" loop preload="auto" crossorigin="anonymous">
<source src="https://files.catbox.moe/frs1d6.mp3" type="audio/mpeg">
</audio>

<!-- SUARA KLIK -->
<audio id="clickSound" preload="auto">
<source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=click-button-1400.mp3" type="audio/mpeg">
</audio>
</div>

<div id="content">
<input id="nama" placeholder="Nama lu... Doyz - 7D">
<div style="font-family:Arial;font-size:10px;font-weight:900;margin-bottom:6px">TOMBOL ABSEN (ADA SUARA KLIK) 👇</div>
<div class="row">
<button class="btnAbsen" id="btnSakit" onclick="doAbsen('SAKIT')">🤒 SAKIT</button>
<button class="btnAbsen" id="btnIzin" onclick="doAbsen('IZIN')">📄 IZIN</button>
</div>
<div id="listWrap"><div id="list" style="font-family:Arial;font-size:11px;text-align:center;color:#999">Belum ada absen</div></div>
<button id="kirim" onclick="kirim()">📧 KIRIM GMAIL</button>
<div style="font-family:Arial;font-size:8px;text-align:center;color:#999;margin-top:6px">SMPKUBA 7D • VOL 30% + CLICK SOUND</div>
</div>
</div>
</div>

<div id="animOverlay"><div id="animText">ABSEN 7D - SAKIT</div></div>

<script>
const audio=document.getElementById('audio');
const clickSound=document.getElementById('clickSound');
const playBtn=document.getElementById('playBtn');
const musicInfo=document.getElementById('musicInfo');
let isPlaying=false;

audio.volume=0.3; // VOLUME 30%
clickSound.volume=0.85;

function playClick(){
  clickSound.currentTime=0;
  clickSound.play().catch(()=>{});
}

function tryPlay(){
  audio.volume=0.3;
  audio.play().then(()=>{
    isPlaying=true;
    playBtn.textContent='⏸️ PAUSE';
    playBtn.classList.add('playing');
    musicInfo.textContent='🎵 PLAYING • 30% 🔊';
  }).catch(()=>{});
}
// Auto play pas klik pertama
document.body.addEventListener('click', tryPlay, {once:true});

function toggleMusic(){
  playClick();
  if(isPlaying){
    audio.pause(); isPlaying=false;
    playBtn.textContent='▶️ PLAY';
    playBtn.classList.remove('playing');
    musicInfo.textContent='🎵 PAUSED • 30%';
  }else{
    audio.volume=0.3;
    audio.play(); isPlaying=true;
    playBtn.textContent='⏸️ PAUSE';
    playBtn.classList.add('playing');
    musicInfo.textContent='🎵 PLAYING • 30% 🔊';
  }
}

const KEY='FINAL_TIKTOK_30_CLICK';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
const namaInput=document.getElementById('nama');
namaInput.value=localStorage.getItem(KEY+'_nama')||'';
namaInput.oninput=()=>localStorage.setItem(KEY+'_nama',namaInput.value);

function render(){
  const l=document.getElementById('list');
  if(data.length==0){l.innerHTML='Belum ada absen sakit/izin'; l.style.textAlign='center'; l.style.color='#999'; return;}
  l.style.textAlign='left'; l.style.color='#000';
  l.innerHTML=data.slice().reverse().map(d=>`${d.nama} - <b style="color:${d.status=='SAKIT'?'#f59e0b':'#6366f1'}">${d.status}</b>`).join('<br>');
}

function doAbsen(s){
  playClick(); // SUARA KLIK
  if(navigator.vibrate) navigator.vibrate(50);
  let n=namaInput.value.trim()||'ANONIM 7D';
  data.push({nama:n,status:s,tgl:new Date().toLocaleDateString('id-ID')});
  localStorage.setItem(KEY,JSON.stringify(data));
  render();
  let o=document.getElementById('animOverlay'); let t=document.getElementById('animText');
  t.textContent=`ABSEN 7D - ${s}`; t.style.color=s=='SAKIT'?'#fbbf24':'#a78bfa';
  o.classList.add('show'); t.style.animation='none'; void t.offsetWidth; t.style.animation='zoom 3.8s forwards';
  setTimeout(()=>o.classList.remove('show'),3600);
  tryPlay();
}

function kirim(){
  playClick();
  if(data.length==0){alert('Belum ada absen!');return;}
  let txt=data.map(d=>d.nama+' - '+d.status+' - '+d.tgl).join('\n');
  fetch('https://formsubmit.co/ajax/doyzzkaciw@gmail.com',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:'ABSEN 7D TIKTOK SONG',message:txt,_captcha:'false'})}).then(()=>alert('✅ Terkirim ke doyzzkaciw@gmail.com'));
}

render();
</script>
</body>
</html>
